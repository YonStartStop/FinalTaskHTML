<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="utf-8" />
    <title>איך מדברים על להט״בים?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <!-- CSS -->
    <link href="styles/reset.css" rel="stylesheet" />
    <link href="styles/myStyle.css" rel="stylesheet" />
</head>

<body>
    <main>
        <div class="chat">
            <p class="chat-bubble kid">
                אמא, מה זה אומר <strong>לסבית</strong>?
            </p>
            <p class="commentary">
                לילדים אין את הרקע שלנו יש על דעות קדומות. על מי היה מנודה בעבר, מי מנודה כיום ומה נחשב ״לגיטימי״. כשהם
                מגיעים לבית הספר היסודי, הרבה דעות מתנגשות מבתים שונים מתחילות לבעבע.
            </p>
            <p class="chat-bubble parent">
                לסבית הכוונה... מישהי שאוהבת בנות!
            </p>
        </div>
    </main>
</body>

</html>
